[package]
name = "binspect"
description = "A simple inspector tool to inspect several types of binaries."
version = "0.0.1"
authors = ["The Packit Team"]
repository = "https://github.com/pack-it/binspect"
keywords = ["binaries", "modification", "ELF", "MachO", "PE"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
rust-version = "1.88.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
lief = "1.0.0"
colored = "3.1.1"
